# Production-shaped compose file.
#
# TLS is terminated at Caddy in front of the firewall — the firewall itself
# never speaks HTTPS. This matches ADR-008 (TLS at the edge, not in the app).
#
# Bring up:   docker compose up -d
# Tear down:  docker compose down
#
# Required environment (in .env at repo root):
#   ANTHROPIC_API_KEY=...
#   FIREWALL_API_KEYS_HASHED=<argon2 hash>   (generate with:
#     `python -m firewall.api.auth hash <plaintext>`)
#   TRUST_PROXY=true                          (acknowledges TLS at edge)
#   FIREWALL_ENV=prod

services:
  firewall:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-firewall:0.1.0
    restart: unless-stopped
    read_only: true                # code + rules are baked in; nothing writes.
    tmpfs:
      - /tmp                       # for anything that needs an ephemeral tmp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      FIREWALL_ENV: ${FIREWALL_ENV:-prod}
      FIREWALL_HOST: 0.0.0.0
      FIREWALL_PORT: 8080
      TRUST_PROXY: ${TRUST_PROXY:-true}
      FIREWALL_API_KEYS_HASHED: ${FIREWALL_API_KEYS_HASHED}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Production defaults: timing hidden, plaintext logging off.
      DEBUG_TIMING: "false"
      LOG_FULL_PROMPTS: "false"
    expose:
      - "8080"
    networks:
      - edge

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - firewall

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
