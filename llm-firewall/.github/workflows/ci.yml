name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Use --no-deps for torch to skip GPU wheels in CI; not required for
          # unit/integration tests which use the stub classifier backend.
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Pytest (unit + integration)
        env:
          PYTHONPATH: src
        run: pytest tests/unit tests/integration -x --tb=short

      - name: pip-audit (vulnerability scan)
        # Continues on error so a new CVE doesn't block PRs immediately, but
        # surfaces the finding. Flip to fail-fast once you're ready to enforce.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: llm-firewall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
